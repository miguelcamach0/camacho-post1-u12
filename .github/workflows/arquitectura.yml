name: Validacion Arquitectonica

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  arquitectura:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache Maven
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Verificar version de Java
        run: java -version

      - name: Ejecutar reglas de arquitectura
        run: mvn -B test -Dtest=ReglasArquitectura --no-transfer-progress

      - name: Ejecutar suite completa de pruebas
        run: mvn -B verify --no-transfer-progress
